<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>

        fieldset {
            width: 400px;
            padding: 20px;
            border-radius: 10px;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
    </style>
</head>
<body>
    <form>
    <fieldset>
        <legend>Formulário</legend>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">
        <br><br>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        <br><br>

        <label for="data">Data de nascimento</label>
        <input type="date" id="data" name="data">
        <br><br>

        <label for="curso">Cursos Presenciais da Computação UniFil</label><br>
        <select id="curso" name="curso">
            <option value="">Selecione</option>
            <option value="cc">Ciência da Computação</option>
            <option value="eng">Engenharia de Software</option>
        </select>
        <br><br>

        <p>Sexo</p>

        <input type="radio" id="feminino" name="sexo" value="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>
        <br><br>

        <p>Interesses</p>

        <input type="checkbox" id="html" name="interesses" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="interesses" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="interesses" value="javascript">
        <label for="javascript">JavaScript</label>
        <br><br>

        <label for="comentarios">Comentários</label><br>
        <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
        <br><br>

        <label for="foto">Upload de foto</label>
        <input type="file" id="foto" name="foto" accept="image/*">
        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </fieldset>
</form>
    <!--display: none (serve para sumir com algo quando muda de formato)-->
</body>
</html>
